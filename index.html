    <!-- Las fuentes críticas se piden ya, sin esperar al CSS. Todas se sirven desde /fonts (sin Google). -->
    <link
      rel="preload"
      href="/fonts/W95FA.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- En recargas y atrás/adelante no hay preloader: se oculta la capa negra antes del primer pintado. -->
    <style>
      .no-boot #boot {
        display: none;
      }
    </style>
    <script>
      (function () {
        var n = performance.getEntriesByType("navigation")[0];
        if (n && n.type !== "navigate")
          document.documentElement.classList.add("no-boot");
      })();
    </script>
  </head>
  <body>
    <!-- Capa negra inmediata: evita el parpadeo gris antes de que React monte el preloader. -->
    <div
      id="boot"
      style="position: fixed; inset: 0; z-index: 2000; background: #04060f"
    ></div>
    <noscript
      ><style>

          display: none;
        }
